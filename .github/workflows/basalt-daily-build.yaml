name: Daily Basalt build

on:
  workflow_dispatch:
    inputs:
      basalt_tag:
        description: "Basalt tag to build (empty = latest release)"
        required: false
        default: ""
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Basalt (CUDA ${{ matrix.cuda_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ["13.4.3"]
    env:
      BUILD_REF: ${{ github.sha }}
      BASALT_REPO: "https://github.com/jesdga95/basalt.git"
      BASALT_CUDA_VERSION: "${{ matrix.cuda_version }}"
      BASALT_BRANCH: "${{ inputs.basalt_tag }}"
      BASALT_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.BUILD_REF || env.BUILD_REF }}
          fetch-depth: 0

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select registry and log in
        id: registry
        uses: ./.github/workflows/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          REGISTRY_ROOT: "${{ steps.registry.outputs.registry_root }}"
        run: |
          source ./.build/git-common.sh
          if [ "$BASALT_BRANCH" == "" ]; then
            BASALT_BRANCH="$("$GITHUB_WORKSPACE/.github/scripts/github_get_last" --type release --repo "$BASALT_REPO" --github-token "$GITHUB_TOKEN")"
          fi
          : "${REPO_GIT_REF:="$(git_get_current_ref)"}"
          : "${BASALT_IMAGE:="$REGISTRY_ROOT/basalt-sm120"}"
          : "${BASALT_IS_RELEASE:="$([ -n "$(git_get_current_tag)" ] && echo 1 || echo 0)"}"
          : "${BASALT_BASE_IMAGE:="docker.io/nvidia/cuda:$BASALT_CUDA_VERSION-devel-ubuntu24.04"}"
          : "${BASALT_RUNTIME_IMAGE:="docker.io/nvidia/cuda:$BASALT_CUDA_VERSION-runtime-ubuntu24.04"}"
          : "${BASALT_PRESET_NAME:="${BASALT_BRANCH//\//-}-cuda-$BASALT_CUDA_VERSION"}"

          echo "REPO_GIT_REF=$REPO_GIT_REF"                 >> "$GITHUB_ENV"
          echo "BASALT_IMAGE=$BASALT_IMAGE"                 >> "$GITHUB_ENV"
          echo "BASALT_IS_RELEASE=$BASALT_IS_RELEASE"       >> "$GITHUB_ENV"
          echo "BASALT_BRANCH=$BASALT_BRANCH"               >> "$GITHUB_ENV"
          echo "BASALT_PRESET_NAME=$BASALT_PRESET_NAME"     >> "$GITHUB_ENV"
          echo "BASALT_BASE_IMAGE=$BASALT_BASE_IMAGE"       >> "$GITHUB_ENV"
          echo "BASALT_RUNTIME_IMAGE=$BASALT_RUNTIME_IMAGE" >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./basalt/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$BASALT_BASE_IMAGE" "$BASALT_RUNTIME_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build Basalt image
        if: steps.check.outputs.needed == 'true'
        run: ./basalt/build-and-push.image.sh build
